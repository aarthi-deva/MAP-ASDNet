project:
  name: MAP-ASDNet
  version: 1.0.0
  random_seed: 42

dataset:
  name: ABIDE-II
  final_subjects: 1021
  asd_subjects: 475
  td_subjects: 546
  site_specific_collections_in_final_cohort: 16
  main_split:
    train: 714
    validation: 153
    test: 154
  # VERIFY against the final LOSO script before release.
  loso_evaluated_sites: 14
  # Based on the manuscript table, these collections are single-class.
  # Confirm that they were intentionally excluded from LOSO.
  suspected_single_class_collections:
    - ABIDEII-KUL_3
    - ABIDEII-NYU_2

imaging:
  modality: T1-weighted_sMRI
  orientation: closest_canonical
  target_voxel_mm: [2.0, 2.0, 2.0]
  interpolation: linear
  foreground_crop: true
  lower_intensity_percentile: 1.0
  upper_intensity_percentile: 99.0
  intensity_normalization: minmax_0_1
  n_slices: 25
  slice_axis: axial
  slice_step_voxels: 3
  image_height: 160
  image_width: 160
  channels: 1
  input_shape: [25, 160, 160, 1]

augmentation:
  training_only: true
  same_geometric_transform_across_subject_slice_sequence: true
  rotation_degrees: 5
  scaling_range: [0.95, 1.05]
  translation_pixels: 4
  intensity_scaling_range: [0.95, 1.05]
  intensity_shift_range: [-0.03, 0.03]
  horizontal_flip: false
  vertical_flip: false

phenotypic:
  raw_variables:
    - AGE_AT_SCAN
    - SEX
    - FIQ
    - VIQ
    - PIQ
  numeric_imputation: training_median
  numeric_standardization: training_mean_std
  missing_value_indicators: true
  categorical_missing_imputation: training_mode
  sex_encoding: one_hot
  processed_dimension_reported_in_manuscript: 9
  verify_processed_dimension_against_final_code: true

model:
  shared_cnn:
    filters: [32, 64, 128, 256]
    kernel_size: [3, 3]
    padding: same
    convolution_bias: false
    batch_normalization: true
    activation: relu
    max_pool_size: [2, 2]
    global_average_pooling: true
    slice_embedding_dim: 128
  bilstm:
    units_per_direction: 96
    bidirectional: true
  attention:
    enabled: true
    attention_dim: 64
  imaging_projection_dim: 128
  phenotypic_projection_dim: 32
  concatenated_fusion_dim: 160
  joint_fusion_dim: 128
  output:
    units: 1
    activation: sigmoid
  dropout:
    recurrent: 0.15
    imaging: 0.15
    phenotypic: 0.10
    fusion: 0.20
  l2_coefficient: 1.0e-5

training:
  optimizer: Adam
  initial_learning_rate: 3.0e-4
  batch_size: 8
  maximum_epochs: 80
  loss: binary_crossentropy
  class_weighting: false
  early_stopping:
    monitor: val_auc
    patience: 12
    restore_best_weights: true
  checkpoint:
    monitor: val_auc
    save_best_only: true
  reduce_lr_on_plateau:
    monitor: val_auc
    factor: 0.5
    patience: 5
    min_learning_rate: 1.0e-6
  threshold_selection:
    source: validation_predictions
    test_set_used: false

evaluation:
  metrics:
    - accuracy
    - balanced_accuracy
    - precision
    - sensitivity
    - specificity
    - f1
    - auc
  five_fold_cross_validation: true
  loso: true
  significance_test:
    method: exact_McNemar
    multiple_comparison_correction: Holm
    alpha: 0.05

site_adversarial:
  evaluated: true
  gradient_reversal_layer: true
  # Fill these from the actual final implementation before release:
  site_classifier_layers: REPLACE_WITH_FINAL_ARCHITECTURE
  site_loss: REPLACE_WITH_FINAL_LOSS
  site_loss_weight: REPLACE_WITH_FINAL_WEIGHT
  grl_coefficient_or_schedule: REPLACE_WITH_FINAL_VALUE_OR_SCHEDULE
